- type: entity
  id: BasePool
  name: pool
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/Planet/water.rsi
    drawdepth: BelowFloor
    layers:
    - state: shoreline_water
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 500
        reagents:
        - ReagentId: Water
          Quantity: 500
  - type: DrainableSolution
    solution: pool
  - type: EdgeSpreader
    id: Pool
  - type: Pool
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: ExaminableSolution
    solution: pool
    exactVolume: true
